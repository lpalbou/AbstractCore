<text x="0" y="140" textLength="990" lengthAdjust="spacingAndGlyphs" fill="#3c3c4d">└────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
<text x="0" y="158" textLength="621" lengthAdjust="spacingAndGlyphs" fill="#e74c3c" font-weight="700">✗ config file corrupt — this console will NOT write until it is fixed</text>
