<text x="0" y="212" textLength="414" lengthAdjust="spacingAndGlyphs" fill="#aaaaaa">  recovery artifacts beside it (newest first):</text>
<text x="0" y="230" textLength="990" lengthAdjust="spacingAndGlyphs" fill="#eeeeee">    abstractcore.json.corrupt-20260725-080000.bak                                                             </text>
<text x="0" y="248" textLength="387" lengthAdjust="spacingAndGlyphs" fill="#aaaaaa">  compare/restore one by hand, then press r</text>
<text x="0" y="536" textLength="27" lengthAdjust="spacingAndGlyphs" fill="#e94560" font-weight="700">1-8</text>
<text x="27" y="536" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#aaaaaa"> screens</text>
