[package]
name = "abstractcore-console"
version = "0.2.0"
edition = "2021"
# MSRV floor comes from the engine (abstracttui 0.3.6 declares 1.87).
rust-version = "1.87"
license = "MIT"
description = "A terminal console for AbstractCore: configure models, providers and capability routes, browse, download and delete local models, and install local engines (Ollama, LM Studio, MLX, llama.cpp). Also a library of the shared Models/Engines screens, rendered by AbstractTUI."
repository = "https://github.com/lpalbou/AbstractCore"
homepage = "https://github.com/lpalbou/AbstractCore/tree/main/console-tui"
documentation = "https://docs.rs/abstractcore-console"
readme = "README.md"
keywords = ["abstractcore", "tui", "terminal", "llm", "models"]
categories = ["command-line-utilities"]
# Published to crates.io from the AbstractCore repository's release
# workflow (`cargo install abstractcore-console`); the gateway console
# depends on it for the shared Models/Engines screens. Only the crate
# sources, test fixtures, README and changelog ship; dev scripts,
# captures and backlog notes stay in git.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.json",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
]

[lib]
name = "abstractcore_console"
path = "src/lib.rs"

[[bin]]
name = "abstractcore-console"
path = "src/main.rs"

[dependencies]
# The rendering engine — published crate, exactly what any user installs.
# Born at 0.2.22: PageHost (screens), Disclosure (config groups),
# Select/Combobox (pickers — modal popup anchoring fixed 0.2.20),
# masked TextInput (API keys), ChoicePrompt (decision gates), Drawer
# (detail inspector), ThemeSwitcher (0.2.21), Block::on_close (0.2.22),
# Screenshot (SVG test artifacts).
# 0.3.0 (2026-07-30): the ONE breaking change is RunConfig gaining
# `hover_ink` + `platform_clipboard` — exhaustive literals break, spreads
# do not, and both of ours spread. We opt INTO hover_ink (lib.rs) so the
# Button/Select/Checkbox hover visuals the engine always drew finally
# receive motion, and OUT of platform_clipboard in the headless harness
# (tests must never shell out to pbcopy). 0.2.27 carried the same change
# as a patch and was YANKED for it — never pin it.
# 0.3.6 (2026-09-23): the version abstractgateway-console builds on. The
# gateway crate mounts this crate's Models/Engines screens, so both must
# resolve ONE abstracttui (one reactive runtime, one widget set); the
# lockfile pins 0.3.6 exactly like the gateway's.
abstracttui = "0.3.6"
# JSON: the config file IS JSON, and `abstractcore config ... --json`
# emits the derived views. Battle-tested parsing; unknown keys must be
# PRESERVED on rewrite (serde_json::Value round-trip, never a typed
# schema snapshot — inventory fact #1).
serde_json = "1"
# NOTE (M1 review P3-6): ureq (planned for M3's native provider health
# probes + optional server enrichment) is deliberately ABSENT until the
# milestone that calls it — no dead compile weight, no idle audit
# surface. Re-add: ureq 2.12, default-features = false, tls+gzip.
# Secret fingerprints: api_keys.* / server.auth_token render as
# sha256[:8] — the SAME convention the Python side uses
# (provider_profiles.py:120-124), so both surfaces show one fingerprint
# for one key. Values never leave config.rs unredacted.
sha2 = "0.10"
