name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Pytest
        env:
          ABSTRACTCORE_RUN_LOCAL_PROVIDER_TESTS: "0"
          ABSTRACTCORE_RUN_LIVE_API_TESTS: "0"
          ABSTRACTCORE_RUN_MLX_TESTS: "0"
          ABSTRACTCORE_RUN_HUGGINGFACE_TESTS: "0"
          ABSTRACTCORE_TEST_HERMETIC_MODEL_DISCOVERY: "1"
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"
      - name: MkDocs build
        run: mkdocs build -q

  # The terminal console crate (`abstractcore-console`, console-tui/): the
  # gates its crates.io release runs, on every push/PR.
  console-tui:
    name: console-tui crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-tui
      - name: Format
        working-directory: console-tui
        run: cargo fmt --check
      - name: Clippy
        working-directory: console-tui
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: console-tui
        run: cargo test --locked
      - name: Package
        working-directory: console-tui
        run: cargo package --locked

  console-tui-msrv:
    name: console-tui MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in console-tui/Cargo.toml (the
      # floor abstracttui 0.3.6 declares).
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-tui
          key: msrv
      - name: Build
        working-directory: console-tui
        run: cargo build --locked --all-targets
