name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Pytest
        env:
          ABSTRACTCORE_RUN_LOCAL_PROVIDER_TESTS: "0"
          ABSTRACTCORE_RUN_LIVE_API_TESTS: "0"
          ABSTRACTCORE_RUN_MLX_TESTS: "0"
          ABSTRACTCORE_RUN_HUGGINGFACE_TESTS: "0"
          ABSTRACTCORE_TEST_HERMETIC_MODEL_DISCOVERY: "1"
        run: python -m pytest

  # The local-model tests (Transformers, llama.cpp, torch) skip in the job
  # above, whose `[test]` extra installs none of those engines. This job
  # installs them for CPU and runs the whole suite, so a test that only runs
  # with the engines present is seen on every push. No model is downloaded:
  # the tests drive tiny stand-ins and fakes.
  local-models:
    name: Local-model tests (CPU torch, transformers, llama.cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU wheels)
        run: |
          python -m pip install -U pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "llama-cpp-python>=0.3.23,<1.0.0" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install -e ".[test,huggingface]"
          python -c "import torch, transformers, llama_cpp; print('torch', torch.__version__, 'transformers', transformers.__version__, 'llama_cpp', llama_cpp.__version__)"
      - name: Pytest
        env:
          ABSTRACTCORE_RUN_LOCAL_PROVIDER_TESTS: "0"
          ABSTRACTCORE_RUN_LIVE_API_TESTS: "0"
          ABSTRACTCORE_RUN_MLX_TESTS: "0"
          ABSTRACTCORE_RUN_HUGGINGFACE_TESTS: "0"
          ABSTRACTCORE_TEST_HERMETIC_MODEL_DISCOVERY: "1"
        run: python -m pytest

  # The command sandbox on Linux (abstractcore.tools.sandbox: bubblewrap, and
  # Landlock for the allow-list posture when bwrap is absent). The tests in
  # tests/tools/test_sandbox_linux.py skip with their reason on a host without
  # bwrap/Landlock, so the job above proves nothing about Linux. This job
  # installs bubblewrap, lets it create user namespaces (Ubuntu 24.04 restricts
  # them through AppArmor by default), runs the module, and FAILS unless every
  # one of its tests ran and passed: a skip here is a red job, never a green one.
  linux-sandbox:
    name: Linux command sandbox (bubblewrap + Landlock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # bwrap is not setuid on Ubuntu: it needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc -- /bin/true
          uname -r
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Pytest (Linux sandbox tests must run, not skip)
        run: |
          python -m pytest -rs -p no:cacheprovider \
            tests/tools/test_sandbox_linux.py tests/tools/test_sandbox_spec.py \
            --junitxml=sandbox-junit.xml
      - name: Assert the Linux sandbox tests ran
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = [c for c in ET.parse("sandbox-junit.xml").getroot().iter("testcase")
                   if "test_sandbox_linux" in (c.get("classname") or "")]
          skipped = [c for c in cases if c.find("skipped") is not None]
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          passed = len(cases) - len(skipped) - len(failed)
          print(f"test_sandbox_linux: {len(cases)} collected, {passed} passed, {len(skipped)} skipped, {len(failed)} failed")
          for c in skipped:
              print("SKIPPED:", c.get("name"), "-", (c.find("skipped").get("message") or ""))
          if len(cases) < 6 or skipped or failed:
              sys.exit("The Linux sandbox tests did not all run and pass on this Linux host.")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"
      - name: MkDocs build
        run: mkdocs build -q

  # The terminal console crate (`abstractcore-console`, console-tui/): the
  # gates its crates.io release runs, on every push/PR.
  console-tui:
    name: console-tui crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-tui
      - name: Format
        working-directory: console-tui
        run: cargo fmt --check
      - name: Clippy
        working-directory: console-tui
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: console-tui
        run: cargo test --locked
      - name: Package
        working-directory: console-tui
        run: cargo package --locked

  console-tui-msrv:
    name: console-tui MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in console-tui/Cargo.toml (the
      # floor abstracttui 0.3.6 declares).
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-tui
          key: msrv
      - name: Build
        working-directory: console-tui
        run: cargo build --locked --all-targets
