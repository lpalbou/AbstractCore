[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractcore"
dynamic = ["version"]
description = "Unified interface to all LLM providers with essential infrastructure for tool calling, streaming, and model management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Laurent-Philippe Albou", email = "contact@abstractcore.ai"}
]
maintainers = [
    {name = "Laurent-Philippe Albou", email = "contact@abstractcore.ai"}
]
keywords = [
    "llm",
    "openai",
    "anthropic",
    "ollama",
    "lmstudio",
    "huggingface",
    "mlx",
    "ai",
    "machine-learning",
    "natural-language-processing",
    "tool-calling",
    "streaming"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.9"

# INSTALL SETTINGS -- there are exactly three, and no more may be added:
#
#   pip install abstractcore             light: every remote provider (OpenAI, Anthropic,
#                                        OpenRouter, Portkey, any OpenAI-compatible endpoint,
#                                        LM Studio, Ollama, a vLLM server), the built-in tools,
#                                        media inputs, the HTTP server, and the voice / vision /
#                                        music / 3D capability plugins with their remote backends
#   pip install "abstractcore[apple]"    light + every local engine Apple silicon can run
#   pip install "abstractcore[gpu]"      light + every local engine NVIDIA / AMD machines can run
#
# Everything a light install needs is a base dependency. A capability that cannot be in light
# (heavy or platform-specific) belongs in `apple` and/or `gpu`, never in a new extra.
# The other extras below are deprecated aliases kept so released pins keep installing
# (docs/installation.md#deprecated-aliases), or contributor tooling (dev / test / docs).
# tests/test_install_settings.py enforces all of this.
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.24.0,<1.0.0",
    # Remote providers. OpenRouter, Portkey, Ollama, LM Studio, vLLM and generic
    # OpenAI-compatible endpoints speak HTTP through httpx; OpenAI and Anthropic use their SDKs.
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.25.0,<1.0.0",
    # Precise token counting for OpenAI-style models.
    "tiktoken>=0.5.0,<1.0.0",
    # Built-in tools (fetch_url, web_search, skim_url, system probes).
    "requests>=2.25.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<6.0.0",
    "ddgs>=9.10.0,<10.0.0; python_version >= '3.10'",
    "duckduckgo-search>=3.8.0,<4.0.0; python_version < '3.10'",
    "psutil>=5.9,<8",
    # Media inputs: images, PDF (pypdf, permissive licence), Office documents, spreadsheets;
    # Pillow also renders Glyph visual-text compression.
    "Pillow>=10.0.0,<13.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "unstructured[docx,pptx,xlsx,odt,rtf]>=0.10.0,<1.0.0",
    "pandas>=1.0.0,<3.0.0",
    # OpenAI-compatible HTTP server and console (`abstractcore serve`, `abstractcore-endpoint`).
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "sse-starlette>=1.6.0,<2.0.0",
    # Capability plugins (llm.voice / llm.audio, llm.vision, llm.music, llm.scene3d). Their
    # base installs carry no local engine; `apple` / `gpu` add the engines.
    "abstractvoice>=0.13.0",
    "abstractvision>=0.3.31",
    "abstractmusic>=0.1.15; python_version >= '3.10'",
    "abstract3d>=0.1.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://lpalbou.github.io/AbstractCore"
Documentation = "https://github.com/lpalbou/AbstractCore#readme"
Repository = "https://github.com/lpalbou/AbstractCore"
"Bug Tracker" = "https://github.com/lpalbou/AbstractCore/issues"
Changelog = "https://github.com/lpalbou/AbstractCore/blob/main/CHANGELOG.md"

[project.scripts]
# Configuration CLI (manage AbstractCore settings, API keys, models)
abstractcore = "abstractcore.config.main:main"
abstractcore-config = "abstractcore.config.main:main"

# Interactive Chat CLI (REPL for LLM interaction)
abstractcore-chat = "abstractcore.utils.cli:main"

# Single-model OpenAI-compatible endpoint (local inference hosting)
abstractcore-endpoint = "abstractcore.endpoint.app:main"

# Built-in Applications
summarizer = "abstractcore.apps.summarizer:main"
abstractcore-summarizer = "abstractcore.apps.summarizer:main"
extractor = "abstractcore.apps.extractor:main"
abstractcore-extractor = "abstractcore.apps.extractor:main"
judge = "abstractcore.apps.judge:main"
abstractcore-judge = "abstractcore.apps.judge:main"
intent = "abstractcore.apps.intent:main"
abstractcore-intent = "abstractcore.apps.intent:main"
deepsearch = "abstractcore.apps.deepsearch:main"
abstractcore-deepsearch = "abstractcore.apps.deepsearch:main"

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# The two local-engine settings. Each is a superset of the light install.
# ---------------------------------------------------------------------------

# MLX PROVIDER DEPENDENCY RULE
# ----------------------------
# `mlx-vlm` ships WITH `mlx-lm` in every setting that installs the MLX provider.
# It is not optional and must never be split out again: a gateway that loads
# sighted Qwen3.x checkpoints without mlx-vlm accepts images and silently drops
# them (`mlx_vlm_not_installed`), and the model describes screenshots it never
# received. mlx-vlm 0.7.1 provides Qwen4-Exp, embedded MTP and native recurrent
# APC; MLX 0.32.2 is the tested execution floor for that graph.
apple = [
    # MLX text + vision provider.
    "mlx>=0.32.2,<1.0.0",
    "mlx-lm>=0.31.3,<1.0.0",
    "mlx-vlm>=0.7.1,<0.8.0",  # image input and native MTP
    "outlines>=0.1.0",  # native structured output
    # HuggingFace provider (transformers / GGUF via llama.cpp) and local embeddings.
    # Pins stay aligned with abstractvoice[all-apple] and abstractvision[all-apple]
    # (via mflux) so pip does not backtrack across incompatible numpy / Pillow / HF stacks.
    "transformers>=5.3.0,<6.0.0",
    "torch>=2.7.1,<3.0.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.1.0",
    "sentencepiece>=0.1.99,<1.0.0",
    "llama-cpp-python>=0.3.23,<1.0.0",
    "accelerate>=1.0.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "numpy>=2.1.0,<3.0.0",
    "Pillow>=12.1.1,<13.0.0",
    # Local voice (TTS/STT), image/video and music engines.
    "abstractvoice[all-apple]>=0.13.0",
    "omnivoice>=0.1.5",
    "abstractvision[all-apple]>=0.3.31",
    "abstractmusic[all-apple]>=0.1.15",
    # Headless-browser rendering (`browser_probe`, JS rendering in fetch_url). Kept out of light
    # (a browser is never a base-install cost); the browser binary is a one-time step:
    # python -m playwright install --only-shell chromium
    "playwright>=1.49.0,<2.0.0",
]

# `gpu` also resolves on Windows x86_64 with wheels only (backlog 0988): vLLM ships Linux
# wheels only, and llama-cpp-python is a source build on PyPI, so both are marked out there.
# On Windows the AbstractFramework installer (install.ps1) adds PyTorch's CUDA build and
# llama.cpp's prebuilt CUDA / Vulkan / CPU wheel; markers cannot choose a CUDA build.
gpu = [
    # vLLM provider (CUDA / ROCm), Linux only upstream.
    "vllm>=0.6.0,<1.0.0; sys_platform == 'linux'",
    "outlines>=0.1.0",
    # HuggingFace provider (transformers / GGUF via llama.cpp) and local embeddings.
    "transformers>=4.57.1,<6.0.0",
    "torch>=2.6.0,<3.0.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.1.0",
    "sentencepiece>=0.1.99,<1.0.0",
    # Windows: not from PyPI (source build only); install.ps1 installs the prebuilt wheel.
    "llama-cpp-python>=0.3.23,<1.0.0; sys_platform != 'win32'",
    "sentence-transformers>=5.1.0,<6.0.0",
    "numpy>=1.20.0,<3.0.0; python_version < '3.13'",
    "numpy>=2.1.0,<3.0.0; python_version >= '3.13'",
    # Local voice (TTS/STT), image/video and music engines.
    "abstractvoice[all-gpu]>=0.13.0",
    "omnivoice>=0.1.5",
    "abstractvision[all-gpu]>=0.3.32",  # 0.3.32: no MLX-Gen; stable-diffusion.cpp marked out on Windows
    "abstractmusic[all-gpu]>=0.1.15",
    # Headless-browser rendering (`browser_probe`, JS rendering in fetch_url). Kept out of light
    # (a browser is never a base-install cost); the browser binary is a one-time step:
    # python -m playwright install --only-shell chromium
    "playwright>=1.49.0,<2.0.0",
]

# ---------------------------------------------------------------------------
# Deprecated aliases, kept so released pins (`abstractcore[remote,...]`,
# `abstractcore[all-apple]`, ...) keep installing with the same functionality.
# Documented once, in docs/installation.md#deprecated-aliases; never shown anywhere else.
# Use light (no extra), `apple` or `gpu`.
# ---------------------------------------------------------------------------

# Covered by the light install.
remote = []
openai = []
anthropic = []
openrouter = []
portkey = []
openai-compatible = []
ollama = []
lmstudio = []
tools = []
tool = []
tokens = []
media = []
compression = []
server = []
voice = []
audio = []
vision = []
music = []
scene3d = []
3d = []

# Covered by `apple`.
all-apple = ["abstractcore[apple]"]
mlx = ["abstractcore[apple]"]
mlx-vision = ["abstractcore[apple]"]

# Covered by `gpu`.
all-gpu = ["abstractcore[gpu]"]
vllm = ["abstractcore[gpu]"]

# Platform-neutral bundles with no single setting to map to (they install on Intel Macs and
# Windows, where neither `apple` nor `gpu` applies). They keep their exact contents.
huggingface = [
    "transformers>=4.57.1,<6.0.0",
    "torch>=2.6.0,<3.0.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.1.0",
    "sentencepiece>=0.1.99,<1.0.0",
    "llama-cpp-python>=0.3.23,<1.0.0",
    "outlines>=0.1.0",
]
embeddings = [
    "sentence-transformers>=5.1.0,<6.0.0",
    "numpy>=1.20.0,<3.0.0; python_version < '3.13'",
    "numpy>=2.1.0,<3.0.0; python_version >= '3.13'",
]
vision-diffusers = ["abstractvision[huggingface]>=0.3.31"]
vision-sdcpp = ["abstractvision[sdcpp]>=0.3.31"]
vision-local = ["abstractvision[local]>=0.3.31"]
browser = ["playwright>=1.49.0,<2.0.0"]
# PyMuPDF-family PDF extraction is an explicit licence opt-in (AGPL / commercial).
pdf-pymupdf-commercial = [
    "pymupdf4llm>=0.0.20,<1.0.0",
    "pymupdf-layout>=1.26.6,<2.0.0",
]
all-non-mlx = [
    "abstractcore[huggingface,embeddings]",
    "omnivoice>=0.1.5",
]
all = [
    "abstractcore[huggingface,embeddings]",
    "omnivoice>=0.1.5",
    "mlx>=0.32.2,<1.0.0",
    "mlx-lm>=0.31.3,<1.0.0",
    "mlx-vlm>=0.7.1,<0.8.0",
    "vllm>=0.6.0,<1.0.0",
]
mlx-bench = ["matplotlib>=3.8.0,<4.0.0"]
full-dev = [
    "abstractcore[all,dev,test,docs]",
]

# ---------------------------------------------------------------------------
# Contributor tooling (not install settings).
# ---------------------------------------------------------------------------
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # Chat-template rendering tests render real GGUF templates with Jinja2.
    "jinja2>=3.0.0,<4.0.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-autorefs>=0.4.0",
]


[tool.setuptools]
packages = [
    "abstractcore",
    "abstractcore.capabilities",
    "abstractcore.core",
    "abstractcore.providers",
    "abstractcore.tools",
    "abstractcore.structured",
    "abstractcore.events",
    "abstractcore.embeddings",
    "abstractcore.architectures",
    "abstractcore.utils",
    "abstractcore.assets",
    "abstractcore.mcp",
    "abstractcore.server",
    "abstractcore.endpoint",
    "abstractcore.apps",
    "abstractcore.processing",
    "abstractcore.exceptions",
    "abstractcore.media",
    "abstractcore.media.processors",
    "abstractcore.media.handlers",
    "abstractcore.media.utils",
    "abstractcore.compression",
    "abstractcore.config",
    "abstractcore.console"
]

[tool.setuptools.dynamic]
version = {attr = "abstractcore.utils.version.__version__"}

[tool.setuptools.package-data]
abstractcore = [
    "assets/*.json",
    "assets/*.jsonld",
    "assets/*.md",
    "assets/*.ttf",
    "py.typed",
]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
known_first_party = ["abstractcore"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "transformers.*",
    "torch.*",
    "mlx.*",
    "mlx_lm.*",
    "llama_cpp.*",
    "outlines.*",
    "vllm.*",
]
ignore_missing_imports = true

# Ruff configuration
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Within an except clause, raise exceptions with raise ... from err
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --tb=short --strict-markers --strict-config --disable-warnings -p no:cacheprovider"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "basic: Level A (contract/unit) tests",
    "vision: Tests requiring vision capabilities",
    "provider: Tests for specific provider functionality",
    "provider_required: Tests requiring specific provider availability",
    "slow: Slow-running tests (use -m \"not slow\" to skip)",
    "comprehensive: Comprehensive vision tests across all models/images",
    "smoke: Quick smoke tests for basic functionality",
    "integration: Integration tests that test multiple components",
    "e2e: Level C (end-to-end/real infra) tests (opt-in)",
    "unit: Unit tests for individual components",
    "phase1: Phase 1 development tests (core integration)",
    "phase2: Phase 2 development tests (documentation accuracy)",
    "phase3: Phase 3 development tests (advanced features)",
    "performance: Performance and benchmark tests",
    "large_files: Tests requiring large test files",
    "requires_deps: Tests requiring optional dependencies",
    "asyncio: Async tests (pytest-asyncio)",
]

# Coverage configuration
[tool.coverage.run]
source = ["abstractcore"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
